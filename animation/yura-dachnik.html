<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Юра-дачник</title>
<style>
  html,body{margin:0;height:100%;background:#101519;display:flex;align-items:center;justify-content:center;overflow:hidden}
  svg{width:100vw;height:100vh;display:block}
  #replay{position:fixed;top:14px;right:16px;z-index:5;font:600 14px/1 system-ui,sans-serif;color:#fff;
    background:rgba(30,40,50,.55);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:8px 16px;cursor:pointer}
  #replay:hover{background:rgba(30,40,50,.85)}
</style>
</head>
<body>
<button id="replay">▶ Сначала</button>
<svg id="film" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Arial, sans-serif">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#79B3DE"/>
    <stop offset="1" stop-color="#C8E3F4"/>
  </linearGradient>
  <pattern id="plaid" width="22" height="22" patternUnits="userSpaceOnUse">
    <rect width="22" height="22" fill="#EAD98F"/>
    <rect y="8" width="22" height="5" fill="#C9A55A" opacity=".8"/>
    <rect x="8" width="5" height="22" fill="#9AA45A" opacity=".7"/>
  </pattern>
  <g id="cloud">
    <circle cx="0" cy="0" r="34" fill="#FFFFFF"/>
    <circle cx="34" cy="10" r="26" fill="#FFFFFF"/>
    <circle cx="-34" cy="12" r="24" fill="#FFFFFF"/>
    <circle cx="8" cy="18" r="28" fill="#F2F8FC"/>
  </g>
  <!-- ряд кустов на горизонте -->
  <path id="bushes" d="M0,462 Q60,345 120,462 Q180,380 240,462 Q300,340 360,462 Q420,385 480,462
    Q540,348 600,462 Q660,382 720,462 Q780,342 840,462 Q900,386 960,462 Q1020,346 1080,462
    Q1140,380 1200,462 Q1260,344 1320,462 Q1380,384 1440,462 Q1500,350 1560,462 Q1620,382 1680,462
    Q1740,346 1800,462 Q1860,388 1920,462 Z" fill="#4C8A4C"/>
  <clipPath id="gableClip"><path d="M560,630 L740,362 L920,630 Z"/></clipPath>
  <!-- клип «над водой»: всё, что ниже глади (y>850), не рисуется — ноги не «лагают» -->
  <clipPath id="waterClip"><rect x="880" y="380" width="540" height="470"/></clipPath>
</defs>

<!-- фон общий -->
<rect width="1920" height="1080" fill="url(#sky)"/>
<rect y="460" width="1920" height="620" fill="#85BB4F"/>
<use href="#bushes"/>
<g>
  <use href="#cloud" x="330" y="150">
    <animateTransform attributeName="transform" type="translate" values="0 0;40 0;0 0" dur="16s" repeatCount="indefinite"/>
  </use>
  <use href="#cloud" x="920" y="95" transform="scale(.8)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-50 0;0 0" dur="20s" repeatCount="indefinite" additive="sum"/>
  </use>
  <use href="#cloud" x="1520" y="170">
    <animateTransform attributeName="transform" type="translate" values="0 0;30 0;0 0" dur="14s" repeatCount="indefinite"/>
  </use>
</g>

<!-- ============ СЦЕНА А: ПРУД ============ -->
<g id="scA">
  <animate attributeName="opacity" values="1;0" begin="6.9s" dur="0.5s" fill="freeze"/>
  <!-- пруд -->
  <ellipse cx="1000" cy="800" rx="640" ry="200" fill="#6E9271"/>
  <ellipse cx="1000" cy="800" rx="640" ry="200" fill="none" stroke="#5F8263" stroke-width="6" opacity=".5"/>
  <!-- кувшинки -->
  <ellipse cx="620" cy="850" rx="60" ry="20" fill="#93B96A"/>
  <ellipse cx="830" cy="890" rx="46" ry="15" fill="#8DB463"/>
  <ellipse cx="1280" cy="905" rx="70" ry="22" fill="#93B96A"/>
  <ellipse cx="1390" cy="860" rx="50" ry="16" fill="#8DB463"/>
  <ellipse cx="960" cy="945" rx="55" ry="17" fill="#8DB463"/>
  <!-- травка в воде -->
  <g stroke="#5E7F52" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M700,905 l6,-14 M712,905 l6,-14 M724,905 l6,-14 M736,905 l6,-14"/>
    <path d="M1440,930 l6,-14 M1452,930 l6,-14 M1464,930 l6,-14"/>
  </g>
  <!-- рогоз слева и справа -->
  <g stroke-linecap="round">
    <g stroke="#6B8F3E" stroke-width="6" fill="none">
      <path d="M285,905 V790"/><path d="M330,915 V810"/>
      <path d="M285,850 q-28,-16 -36,-46"/><path d="M330,870 q26,-18 32,-48"/>
      <path d="M1585,905 V785"/><path d="M1630,915 V815"/>
      <path d="M1585,845 q-26,-18 -32,-48"/><path d="M1630,875 q26,-18 34,-44"/>
    </g>
    <g fill="#7A3B2E">
      <rect x="276" y="735" width="18" height="58" rx="9"/>
      <rect x="321" y="760" width="18" height="52" rx="9"/>
      <rect x="1576" y="730" width="18" height="58" rx="9"/>
      <rect x="1621" y="765" width="18" height="52" rx="9"/>
    </g>
  </g>
  <!-- лягушка -->
  <g id="frog" transform="translate(620,838)">
    <animateTransform attributeName="transform" type="translate" values="620 838;620 818;620 838" begin="5.05s" dur="0.4s" calcMode="spline" keySplines="0.3 0 0.4 1;0.4 0 0.7 1" fill="freeze"/>
    <ellipse cx="0" cy="-8" rx="20" ry="12" fill="#6FA84C"/>
    <circle cx="-12" cy="-20" r="6" fill="#6FA84C"/><circle cx="10" cy="-20" r="6" fill="#6FA84C"/>
    <circle cx="-12" cy="-21" r="2.4" fill="#26331D"/><circle cx="10" cy="-21" r="2.4" fill="#26331D"/>
  </g>
  <!-- стрекоза -->
  <g id="dragonfly" opacity="0.9">
    <animateMotion path="M250,240 q220,80 420,30 q240,-60 460,40 q220,90 470,50" begin="0.2s" dur="6.6s" fill="freeze"/>
    <ellipse cx="0" cy="0" rx="16" ry="3.4" fill="#4A7FB5"/>
    <circle cx="-16" cy="0" r="4.5" fill="#3B6D9E"/>
    <g fill="#BFDFF2" opacity=".85">
      <ellipse cx="-4" cy="-8" rx="4" ry="10">
        <animate attributeName="ry" values="10;3;10" dur="0.12s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="4" cy="-8" rx="4" ry="10">
        <animate attributeName="ry" values="3;10;3" dur="0.12s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
  <!-- заставка -->
  <text id="title" x="960" y="360" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="118" font-weight="bold" fill="#2E6B34" stroke="#FFFFFF" stroke-width="10"
        paint-order="stroke" letter-spacing="4" opacity="0">ЮРА-ДАЧНИК
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.22;0.78;1" begin="0.3s" dur="2.6s" fill="freeze"/>
  </text>
  <!-- табличка СНТ -->
  <g id="sign" transform="translate(300,0)" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="2.5s" dur="0.15s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" values="0.2;1.08;1" begin="2.5s" dur="0.45s"
      calcMode="spline" keySplines="0.3 1.4 0.6 1;0.3 0 0.6 1" additive="sum" fill="freeze"/>
    <rect x="-6" y="655" width="12" height="140" fill="#7A5230"/>
    <rect x="-110" y="560" width="220" height="44" rx="6" fill="#B0592F" stroke="#8A4322" stroke-width="3"/>
    <text x="0" y="591" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFF">ЕГОРЬЕВСК</text>
    <rect x="-100" y="610" width="200" height="66" rx="6" fill="#2E5FA3" stroke="#224A82" stroke-width="3"/>
    <text x="0" y="638" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFF">СНТ</text>
    <text x="0" y="666" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFF">«Взлёт 2»</text>
  </g>

  <!-- Юра в гидрокостюме: заходит, ныряет -->
  <g id="diver" transform="translate(2010,930)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-280 0" begin="3.0s" dur="1.15s" additive="sum" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-190 -150;-450 -70;-580 -20" keyTimes="0;0.4;0.8;1"
      begin="4.25s" dur="0.6s" calcMode="spline" keySplines="0.3 0 0.6 1;0.4 0 0.7 1;0.4 0 0.8 1" additive="sum" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" begin="4.83s" dur="0.06s" fill="freeze"/>
    <g id="diverPose">
      <animateTransform attributeName="transform" type="rotate" values="0 0 -90;-55 0 -90;-102 0 -90" keyTimes="0;0.45;1" begin="4.25s" dur="0.6s" fill="freeze"/>
      <g transform="scale(-1,1)">
      <!-- ноги: прямые, качаются только от бедра -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-14 -6 -90;14 -6 -90;-14 -6 -90" begin="3.0s" dur="0.38s" repeatCount="3" fill="remove"/>
        <rect x="-22" y="-92" width="22" height="82" rx="8" fill="#22252A"/>
        <rect x="-26" y="-13" width="30" height="13" rx="5" fill="#15171B"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="14 6 -90;-14 6 -90;14 6 -90" begin="3.0s" dur="0.38s" repeatCount="3" fill="remove"/>
        <rect x="0" y="-92" width="22" height="82" rx="8" fill="#2A2E34"/>
        <rect x="-4" y="-13" width="30" height="13" rx="5" fill="#1B1E23"/>
      </g>
      <rect x="-24" y="-104" width="48" height="24" rx="9" fill="#22252A"/>
      <!-- торс -->
      <rect x="-24" y="-170" width="48" height="76" rx="12" fill="#26292F"/>
      <!-- руки: перед нырком поднимаются вперёд -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 -14 -160;-95 -14 -160" begin="4.1s" dur="0.25s" fill="freeze"/>
        <rect x="-21" y="-162" width="13" height="60" rx="6.5" fill="#1E2126"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 16 -160;-95 16 -160" begin="4.05s" dur="0.25s" fill="freeze"/>
        <rect x="9" y="-162" width="13" height="60" rx="6.5" fill="#2A2E34"/>
      </g>
      <!-- голова в капюшоне, маска, трубка -->
      <circle cx="4" cy="-196" r="25" fill="#22252A"/>
      <path d="M9,-214 a22,22 0 0 1 18,26 l-14,4 Z" fill="#F0C29A"/>
      <circle cx="17" cy="-198" r="9" fill="#DDEBF4" stroke="#4A4E55" stroke-width="3.5"/>
      <path d="M8,-206 q-14,-4 -22,2" stroke="#4A4E55" stroke-width="3.5" fill="none"/>
      <path d="M-4,-218 q-8,20 2,36" stroke="#5A6068" stroke-width="6" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- всплеск -->
  <g transform="translate(1150,845)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="4.78s" dur="0.55s" fill="freeze"/>
      <g stroke="#F2F8FB" stroke-width="9" stroke-linecap="round" fill="none">
        <path d="M0,-6 V-52"/><path d="M-26,0 L-52,-38"/><path d="M26,0 L52,-38"/>
        <path d="M-44,6 L-70,-8"/><path d="M44,6 L70,-8"/>
      </g>
      <animateTransform attributeName="transform" type="scale" values="0.3;1.25" begin="4.78s" dur="0.55s" fill="freeze"/>
    </g>
  </g>
  <!-- круги на воде после нырка -->
  <g fill="none" stroke="#EAF3EE" stroke-width="5">
    <ellipse cx="1150" cy="850" rx="8" ry="3" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" begin="4.9s" dur="1.1s" fill="freeze"/>
      <animate attributeName="rx" values="10;120" begin="4.9s" dur="1.1s" fill="freeze"/>
      <animate attributeName="ry" values="3.5;38" begin="4.9s" dur="1.1s" fill="freeze"/>
    </ellipse>
    <ellipse cx="1150" cy="850" rx="8" ry="3" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" begin="5.15s" dur="1.1s" fill="freeze"/>
      <animate attributeName="rx" values="10;95" begin="5.15s" dur="1.1s" fill="freeze"/>
      <animate attributeName="ry" values="3.5;30" begin="5.15s" dur="1.1s" fill="freeze"/>
    </ellipse>
  </g>

  <!-- выныривание: тело поднимается из воды, всё ниже глади скрыто клипом -->
  <g clip-path="url(#waterClip)">
    <g id="surfacer" transform="translate(1150,1160)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -324;0 -310" keyTimes="0;0.75;1"
        begin="5.85s" dur="0.75s" calcMode="spline" keySplines="0.25 0 0.35 1;0.4 0 0.6 1" additive="sum" fill="freeze"/>
      <!-- торс в гидрокостюме (пояс на глади, ноги под водой и не рисуются) -->
      <rect x="-26" y="-96" width="52" height="100" rx="14" fill="#26292F"/>
      <!-- руки подняты вверх, держат рыбу -->
      <rect x="-34" y="-160" width="14" height="80" rx="7" fill="#1E2126" transform="rotate(8 -27 -82)"/>
      <rect x="20" y="-160" width="14" height="80" rx="7" fill="#2A2E34" transform="rotate(-8 27 -82)"/>
      <circle cx="-30" cy="-158" r="8" fill="#F0C29A"/>
      <circle cx="30" cy="-158" r="8" fill="#F0C29A"/>
      <!-- голова: маска сдвинута на лоб, довольная улыбка -->
      <circle cx="0" cy="-122" r="24" fill="#22252A"/>
      <path d="M-9,-134 a22,22 0 0 1 22,12 l-4,16 q-12,4 -20,-2 Z" fill="#F0C29A"/>
      <circle cx="2" cy="-142" r="8" fill="#DDEBF4" stroke="#4A4E55" stroke-width="3"/>
      <circle cx="4" cy="-122" r="2.6" fill="#26241F"/>
      <path d="M-2,-112 q6,5 12,0" stroke="#26241F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- карп над головой -->
      <g id="fish" transform="translate(0,-196)">
        <animateTransform attributeName="transform" type="rotate" values="0;7;-7;5;0" begin="6.7s" dur="0.9s" additive="sum" fill="freeze"/>
        <path d="M-95,0 Q-60,-38 0,-38 Q60,-38 88,-6 Q60,30 0,34 Q-58,34 -95,0 Z" fill="#C08A4A"/>
        <path d="M-95,0 L-130,-26 Q-118,0 -130,26 Z" fill="#9A6D33"/>
        <path d="M-30,-34 Q-6,-58 26,-40 L-4,-30 Z" fill="#9A6D33"/>
        <path d="M-60,26 Q-40,40 -18,32 L-40,20 Z" fill="#9A6D33"/>
        <g fill="none" stroke="#A97B3E" stroke-width="3">
          <path d="M-52,-12 q10,10 0,22"/><path d="M-28,-16 q10,12 0,28"/><path d="M-4,-16 q10,12 0,30"/><path d="M20,-14 q9,10 0,24"/>
        </g>
        <circle cx="58" cy="-8" r="8" fill="#FFF"/><circle cx="60" cy="-8" r="3.6" fill="#241F19"/>
        <path d="M84,4 q-8,6 -16,4" stroke="#8A5F2A" stroke-width="3" fill="none"/>
        <path d="M88,-2 l18,-4 M88,2 l18,6" stroke="#8A5F2A" stroke-width="2.6"/>
      </g>
    </g>
  </g>
  <!-- круги при выныривании -->
  <g fill="none" stroke="#EAF3EE" stroke-width="5">
    <ellipse cx="1150" cy="852" rx="8" ry="3" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" begin="5.95s" dur="1.0s" fill="freeze"/>
      <animate attributeName="rx" values="12;115" begin="5.95s" dur="1.0s" fill="freeze"/>
      <animate attributeName="ry" values="4;36" begin="5.95s" dur="1.0s" fill="freeze"/>
    </ellipse>
    <ellipse cx="1150" cy="852" rx="8" ry="3" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" begin="6.25s" dur="1.0s" fill="freeze"/>
      <animate attributeName="rx" values="12;85" begin="6.25s" dur="1.0s" fill="freeze"/>
      <animate attributeName="ry" values="4;27" begin="6.25s" dur="1.0s" fill="freeze"/>
    </ellipse>
  </g>
  <!-- брызги-капли -->
  <g fill="#EAF4F9">
    <circle r="6" opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="6.0s" dur="0.55s" fill="freeze"/>
      <animateMotion path="M1100,760 q-40,-60 -70,-10" begin="6.0s" dur="0.55s" fill="freeze"/>
    </circle>
    <circle r="5" opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="6.05s" dur="0.5s" fill="freeze"/>
      <animateMotion path="M1205,755 q40,-55 66,-6" begin="6.05s" dur="0.5s" fill="freeze"/>
    </circle>
    <circle r="4" opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="6.1s" dur="0.5s" fill="freeze"/>
      <animateMotion path="M1150,720 q6,-50 34,-30" begin="6.1s" dur="0.5s" fill="freeze"/>
    </circle>
  </g>
</g>

<!-- ============ СЦЕНА Б: СТРОЙКА, ДВОР, ФИНАЛ ============ -->
<g id="scB" opacity="0">
  <animate attributeName="opacity" values="0;1" begin="6.9s" dur="0.5s" fill="freeze"/>

  <!-- прудик в левом нижнем углу -->
  <ellipse cx="70" cy="1075" rx="200" ry="65" fill="#6E9271" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="12.5s" dur="0.3s" fill="freeze"/>
  </ellipse>

  <!-- ДОМ -->
  <g id="house">
    <!-- фундамент -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="7.6s" dur="0.12s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 26;0 0" begin="7.6s" dur="0.3s" calcMode="spline" keySplines="0.3 1.3 0.6 1" fill="freeze"/>
      <rect x="470" y="890" width="540" height="40" fill="#8A8A8A"/>
      <path d="M580,890 v40 M690,890 v40 M800,890 v40 M910,890 v40" stroke="#767676" stroke-width="4"/>
    </g>
    <!-- брёвна стены (6 рядов снизу вверх) -->
    <g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" begin="7.95s" dur="0.1s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 30;0 0" begin="7.95s" dur="0.28s" calcMode="spline" keySplines="0.3 1.3 0.6 1" fill="freeze"/>
        <rect x="480" y="847" width="520" height="43" fill="#5B3A2C"/><rect x="480" y="885" width="520" height="5" fill="#4A2E23"/></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" begin="8.37s" dur="0.1s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 30;0 0" begin="8.37s" dur="0.28s" calcMode="spline" keySplines="0.3 1.3 0.6 1" fill="freeze"/>
        <rect x="480" y="804" width="520" height="43" fill="#5F3D2E"/><rect x="480" y="842" width="520" height="5" fill="#4A2E23"/></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" begin="8.79s" dur="0.1s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 30;0 0" begin="8.79s" dur="0.28s" calcMode="spline" keySplines="0.3 1.3 0.6 1" fill="freeze"/>
        <rect x="480" y="761" width="520" height="43" fill="#5B3A2C"/><rect x="480" y="799" width="520" height="5" fill="#4A2E23"/></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" begin="9.21s" dur="0.1s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 30;0 0" begin="9.21s" dur="0.28s" calcMode="spline" keySplines="0.3 1.3 0.6 1" fill="freeze"/>
        <rect x="480" y="718" width="520" height="43" fill="#5F3D2E"/><rect x="480" y="756" width="520" height="5" fill="#4A2E23"/></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" begin="9.63s" dur="0.1s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 30;0 0" begin="9.63s" dur="0.28s" calcMode="spline" keySplines="0.3 1.3 0.6 1" fill="freeze"/>
        <rect x="480" y="675" width="520" height="43" fill="#5B3A2C"/><rect x="480" y="713" width="520" height="5" fill="#4A2E23"/></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" begin="10.05s" dur="0.1s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 30;0 0" begin="10.05s" dur="0.28s" calcMode="spline" keySplines="0.3 1.3 0.6 1" fill="freeze"/>
        <rect x="480" y="630" width="520" height="45" fill="#5F3D2E"/><rect x="480" y="670" width="520" height="5" fill="#4A2E23"/></g>
    </g>
    <!-- дверь -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="10.3s" dur="0.12s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.6;1.06;1" begin="10.3s" dur="0.35s" calcMode="spline" keySplines="0.3 1.3 0.6 1;0.3 0 0.6 1" additive="sum" fill="freeze"/>
      <rect x="518" y="742" width="76" height="148" rx="6" fill="#F3EDE4"/>
      <rect x="526" y="750" width="60" height="140" rx="4" fill="#7A4A28"/>
      <circle cx="576" cy="822" r="4.5" fill="#E8C97A"/>
    </g>

<script>
  const svg = document.getElementById('film');
  const p = new URLSearchParams(location.search);
  if (p.has('t')) {
    const t = parseFloat(p.get('t')) || 0;
    svg.pauseAnimations();
    svg.setCurrentTime(t);
  }
  document.getElementById('replay').addEventListener('click', () => {
    svg.unpauseAnimations();
    svg.setCurrentTime(0);
  });
</script>
